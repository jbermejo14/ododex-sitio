<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ododex: los datos de tu coche, claros</title>
  <meta name="description" content="Ododex reúne calculadoras y consultas para tu coche: multas, radares e impuestos de vehículos. Sitio independiente, no oficial.">
  <link rel="canonical" href="<!-- ORIGEN -->/">
  <meta property="og:url" content="<!-- ORIGEN -->/">
  <meta property="og:site_name" content="Ododex">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Ododex: los datos de tu coche, claros">
  <link rel="icon" type="image/svg+xml" href="/ododex-favicon.svg">
  <link rel="stylesheet" href="/estilos.css">
  <script>
    (function () {
      var theme = null;
      try {
        var saved = localStorage.getItem('ododex-theme');
        if (saved === 'light' || saved === 'dark') theme = saved;
        if (!theme) {
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          theme = prefersDark ? 'dark' : 'light';
        }
      } catch (e) {
        theme = 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <!-- ADSENSE -->
</head>
<body>
  <header class="site-header">
    <div class="header-container">
      <a class="brand" href="/" aria-label="Ododex, inicio">
        <img class="brand-logo brand-logo-light" src="/brand/ododex-logo-light.svg" alt="Ododex" width="116" height="28">
        <img class="brand-logo brand-logo-dark" src="/brand/ododex-logo-dark.svg" alt="Ododex" width="116" height="28">
      </a>
      <button class="theme-toggle-btn" id="theme-toggle" type="button" aria-label="Cambiar entre tema claro y oscuro">
        <span class="theme-when-light" aria-hidden="true">☾</span>
        <span class="theme-when-dark" aria-hidden="true">☀</span>
      </button>
    </div>
  </header>

  <main class="main-wrapper">
    <h1 class="page-title">Los datos de tu coche, claros.</h1>
    <p class="page-intro">Ododex es un sitio independiente con calculadoras y consultas para quien tiene coche. No es un sitio oficial de la DGT ni de Hacienda: consulta siempre las fuentes oficiales antes de tomar una decisión.</p>
    <nav class="link-grid" aria-label="Secciones">
<!-- SECCIONES -->
    </nav>
  </main>

  <footer class="site-footer">
    <p class="footer-text">Ododex</p>
    <div class="footer-legal">
      <a href="/es/multas/aviso-legal">Aviso legal</a>
      <a href="/es/multas/privacidad">Privacidad</a>
      <a href="/es/multas/cookies">Cookies</a>
    </div>
  </footer>

  <script>
    document.getElementById('theme-toggle').addEventListener('click', function () {
      var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('ododex-theme', next); } catch (e) { /* sin almacenamiento: el tema solo dura esta visita */ }
    });
  </script>
</body>
</html>
