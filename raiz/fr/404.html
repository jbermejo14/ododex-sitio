<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page introuvable | Ododex</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/ododex-favicon.svg">
  <link rel="stylesheet" href="/estilos.css">
  <script>
    (function () {
      var theme = null;
      try {
        var saved = localStorage.getItem('ododex-theme');
        if (saved === 'light' || saved === 'dark') theme = saved;
        if (!theme) {
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          theme = prefersDark ? 'dark' : 'light';
        }
      } catch (e) {
        theme = 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <!-- ADSENSE -->
</head>
<body>
  <header class="site-header">
    <div class="header-container">
      <a class="brand" href="/fr" aria-label="Ododex, accueil">
        <img class="brand-logo brand-logo-light" src="/brand/ododex-logo-light.svg" alt="Ododex" width="116" height="28">
        <img class="brand-logo brand-logo-dark" src="/brand/ododex-logo-dark.svg" alt="Ododex" width="116" height="28">
      </a>
      <button class="theme-toggle-btn" id="theme-toggle" type="button" aria-label="Changer de thème clair/sombre">
        <span class="theme-when-light" aria-hidden="true">☾</span>
        <span class="theme-when-dark" aria-hidden="true">☀</span>
      </button>
    </div>
  </header>

  <main class="main-wrapper">
    <h1 class="page-title">Page introuvable</h1>
    <p class="page-intro">L'adresse que vous cherchez n'existe pas ou a changé de place. Retournez à l'accueil.</p>
    <nav class="link-grid" aria-label="Sections">
      <a class="link-card" href="/fr"><span><span class="link-card-name">Retour à l'accueil</span><span class="link-card-hint">Page d'accueil d'Ododex France</span></span><span class="link-card-arrow" aria-hidden="true">→</span></a>
    </nav>
  </main>

  <footer class="site-footer">
    <p class="footer-text">Ododex</p>
    <div class="footer-legal">
      <a href="/fr/prix-carburants/mentions-legales">Mentions légales</a>
      <a href="/fr/prix-carburants/confidentialite">Confidentialité</a>
      <a href="/fr/prix-carburants/cookies">Cookies</a>
    </div>
  </footer>

  <script>
    document.getElementById('theme-toggle').addEventListener('click', function () {
      var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('ododex-theme', next); } catch (e) { /* sin almacenamiento: el tema solo dura esta visita */ }
    });
  </script>
</body>
</html>
